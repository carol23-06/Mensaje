<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una lechuza para Ariadna</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#3b2f5c;--soft:#6f6494;--lav:#e6deff;--mint:#d3f4e3;--peach:#ffdfd2;--butter:#fff1bd;--sky:#d6ebff;--pink:#ffd6ea;--bg:#f8f4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:18px 18px 28px;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;height:40px}
.back{border:0;background:var(--lav);color:var(--ink);width:40px;height:40px;border-radius:50%;font:600 20px inherit;font-family:inherit;cursor:pointer}
.back[hidden]{visibility:hidden;display:block}
.bar{flex:1;height:12px;background:var(--lav);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb3d9,#ffd48a,#9be3c0);border-radius:9px;transition:width .4s}
.cnt{font-size:14px;color:var(--soft);min-width:38px;text-align:right}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0}
.screen{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
h1{font-size:32px;line-height:1.15;margin:0 0 8px;font-weight:700}
h2{font-size:27px;line-height:1.2;margin:0 0 6px;font-weight:700}
.sub{color:var(--soft);font-size:17px;margin:0 0 18px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:3px solid transparent;border-radius:22px;padding:16px 10px;min-height:118px;font:500 16px/1.25 inherit;font-family:inherit;color:var(--ink);text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s,border-color .15s}
.card .e{font-size:38px}.card small{color:var(--soft);font-size:13px}
.card:active{transform:scale(.96)}
.card.sel{border-color:var(--ink);transform:rotate(-2deg) scale(1.03)}
.c0{background:var(--pink)}.c1{background:var(--mint)}.c2{background:var(--butter)}.c3{background:var(--sky)}.c4{background:var(--peach);grid-column:1/-1;min-height:84px;flex-direction:row;gap:12px}
textarea{width:100%;margin-top:12px;border:3px solid var(--lav);border-radius:18px;padding:12px;font:17px inherit;font-family:inherit;color:var(--ink);background:#fff;resize:none}
.btn{margin-top:18px;width:100%;border:0;border-radius:999px;padding:16px;font:600 19px inherit;font-family:inherit;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:block;text-align:center}
.btn:disabled{opacity:.35}.btn.alt{background:var(--lav);color:var(--ink);margin-top:10px}
.owl{font-size:84px;display:inline-block;animation:fly 2.4s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-12px) rotate(6deg)}}
.cover{text-align:center}
.letter{background:#fffdf5;border:3px dashed #c9b8ff;border-radius:24px;padding:22px 20px;text-align:left;position:relative;box-shadow:0 8px 0 var(--lav)}
.letter h2{text-align:center}
.letter ul{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}
.letter li{display:flex;gap:12px;align-items:flex-start;line-height:1.3}
.letter li b{display:block;font-size:13px;color:var(--soft);font-weight:500}
.letter li span{font-size:26px}
.sign{text-align:right;color:var(--soft);margin:0}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><div class="top" id="top" hidden><button class="back" id="back" aria-label="Atrás">←</button><div class="bar"><i id="fill"></i></div><div class="cnt" id="cnt"></div></div><main id="main"></main></div>
<canvas id="cv"></canvas>
<script>
const NAME="Ariadna";
const Q=[
{k:"Cena",t:"¿Qué cenamos?",h:"Elige tu hechizo culinario",o:[["🍣","Sushi","Accio sushi"],["🍝","Pasta","Pasta a la magia"],["🍔","Hamburguesa","Con todos los extras"],["🍕","Pizza","Y a compartir"]]},
{k:"Plan",t:"¿Qué hacemos?",h:"El plan principal de la noche",o:[["🎬","Cine","Con butaca y todo"],["🍿","Maratón de pelis o series","Manta incluida"],["🌙","Paseo largo","Con pipas de por medio"],["🎲","Juegos de mesa","Prepárate para perder"]]},
{k:"Dónde",t:"¿A dónde vamos?",h:"Elige el escenario",o:[["🛋️","En casa","Nuestro rincón"],["🏰","Salir a un sitio bonito","Toca descubrir"],["🪩","Una discoteca","A bailar hasta tarde"],["🌳","Terraza o parque","Con buen tiempo"]]},
{k:"Look",t:"¿Cómo vamos vestidas?",h:"Tu look para la ocasión",o:[["🧦","Comodísimas","Modo pijama"],["👗","Elegantes","Nos arreglamos"],["👯","Colores a juego","Combinamos"],["😎","Casual con estilo","Cómodas pero guapas"]]},
{k:"Dulce",t:"¿Postre o bebida?",h:"Algo dulce para cerrar",o:[["🍿","Palomitas dulces","Nunca fallan"],["🍰","Tarta de queso","La favorita de todas"],["🍦","Helado","De los grandes"],["🍫","Brownie","Calentito y con helado"]]},
{k:"Final",t:"¿Qué sorpresa quieres al final?",h:"Solo una, elige bien",o:[["💌","Una carta","Escrita a mano"],["🎁","Un detalle","Pequeño y bonito"],["📸","Una foto de recuerdo","Para el álbum"],["🦉","Que sea secreto","Lo descubrirás"]]}
];
const A=[];let step=-1,other=false;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(html){const m=$("main");m.innerHTML='<div class="screen">'+html+'</div>';window.scrollTo(0,0)}
function bar(){const on=step>=0&&step<Q.length;$("top").hidden=!on;if(!on)return;$("fill").style.width=((step+1)/Q.length*100)+"%";$("cnt").textContent=(step+1)+"/"+Q.length}
function cover(){step=-1;bar();show(`<div class="cover"><div class="owl">🦉</div><h1>${NAME}, te ha llegado una lechuza</h1><p class="sub">Trae una carta con una pregunta importante. Ábrela con cuidado.</p><button class="btn" id="go">Abrir la carta ✉️</button></div>`);$("go").onclick=gate}
function gate(){step=-1;bar();show(`<div class="cover"><div class="owl">💌</div><h1 style="font-size:30px">Gracias por darnos otra oportunidad 💕</h1><p class="sub">Esta vez lo hacemos bien, y ya como pareja de verdad. Así que hay una cosa que quiero preguntarte: ¿te gustaría tener otra cita conmigo?</p><button class="btn" id="si">Sí, claro 💖</button><button class="btn alt" id="no">No</button></div>`);$("si").onclick=intro;$("no").onclick=oops}
function intro(){step=-1;bar();show(`<div class="cover"><div class="owl">🦉</div><h1>¡Sabía que dirías que sí!</h1><p class="sub">Ahora te toca diseñar nuestra próxima cita. Responde 6 preguntitas y el plan queda sellado.</p><button class="btn" id="ok">Vamos allá ✨</button></div>`);$("ok").onclick=()=>{step=0;q()}}
function oops(){show(`<div class="cover"><div class="owl">⚠️</div><h1>Error</h1><p class="sub">Esa respuesta no es válida. El hechizo ha fallado y no hay ninguna otra opción. Vuelve a la pantalla anterior para elegir de nuevo.</p><button class="btn" id="vv">Volver a elegir</button></div>`);$("vv").onclick=gate}
function q(){bar();other=false;const d=Q[step],cur=A[step];
const cards=d.o.map((x,i)=>`<button class="card c${i}${cur&&cur.i===i?' sel':''}" data-i="${i}"><span class="e">${x[0]}</span>${x[1]}<small>${x[2]}</small></button>`).join("");
show(`<h2>${d.t}</h2><p class="sub">${d.h}</p><div class="grid">${cards}<button class="card c4${cur&&cur.i===4?' sel':''}" data-i="4"><span class="e">💭</span>Otra idea…</button></div><div id="ow"></div><button class="btn" id="nx" disabled>${step==Q.length-1?'Ver mi plan 🎉':'Siguiente'}</button>`);
const nx=$("nx");
const ready=()=>{const c=A[step];nx.disabled=!c||(c.i===4&&!c.txt)};
const openOther=()=>{$("ow").innerHTML='<textarea id="tx" rows="2" maxlength="120" placeholder="Cuéntame tu idea…"></textarea>';const t=$("tx");t.value=(A[step]&&A[step].txt)||"";t.oninput=()=>{A[step].txt=t.value.trim();ready()};t.focus()};
document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;document.querySelectorAll(".card").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");
if(i===4){A[step]={i:4,txt:(A[step]&&A[step].txt)||"",l:"Otra idea",e:"💭"};openOther()}else{A[step]={i,l:Q[step].o[i][1],e:Q[step].o[i][0]};$("ow").innerHTML=""}ready()});
if(cur&&cur.i===4)openOther();ready();
nx.onclick=()=>{if(step<Q.length-1){step++;q()}else{step=Q.length;end()}};}
function val(c){return c.i===4?c.txt:c.l}
function msg(){return "🦉 Mi plan para nuestra cita, elegido por "+NAME+":\n"+Q.map((d,i)=>d.k+": "+val(A[i])).join("\n")+"\n¡Ya no hay vuelta atrás! ✨"}
function end(){bar();
show(`<div class="letter"><h2>🦉 Carta de admisión</h2><p>Querida ${NAME}: nos complace informarte de que has sido admitida a una cita inolvidable, diseñada por ti misma.</p><ul>${Q.map((d,i)=>`<li><span>${A[i].e}</span><div><b>${d.k}</b>${esc(val(A[i]))}</div></li>`).join("")}</ul><p>Estos planes son para este finde. Era una sorpresa, pero iré a verte. 💫</p><p class="sign">Firmado: tu bruja favorita ⚡</p></div>
<a class="btn" id="wa" target="_blank" rel="noopener">Enviarle mis elecciones 💌</a><button class="btn alt" id="cp">Copiar mensaje</button><button class="btn alt" id="rs">Volver a empezar</button>`);
$("wa").href="https://wa.me/?text="+encodeURIComponent(msg());
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(msg());$("cp").textContent="¡Copiado! Pégalo en tu chat"}catch(e){$("cp").textContent="No se pudo copiar"}};
$("rs").onclick=()=>{A.length=0;cover()};confetti()}
$("back").onclick=()=>{if(step>0){step--;q()}else cover()};
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=$("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const col=["#ffb3d9","#ffd48a","#9be3c0","#b9a6ff","#8fd0ff"];
const p=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,vy:2+Math.random()*3,vx:-1+Math.random()*2,c:col[Math.random()*5|0],a:Math.random()*6}));let f=0;
(function d(){x.clearRect(0,0,c.width,c.height);p.forEach(o=>{o.y+=o.vy;o.x+=o.vx+Math.sin(o.a+=.05);x.fillStyle=o.c;x.fillRect(o.x,o.y,o.r,o.r*1.6)});if(++f<260)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
cover();
</script></body></html>
